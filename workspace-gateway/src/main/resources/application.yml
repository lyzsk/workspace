server:
  port: ${GATEWAY_PORT:61115}

workspace:
  jwt:
    secret: ${JWT_SECRET:dev-only-workspace-secret-0123456789abcdef}
    issuer: workspace
  auth:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN:dev-only-gateway-token-change-me}

spring:
  application:
    name: workspace-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        fail-fast: ${NACOS_FAIL_FAST:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_USER_RATE:100}
                redis-rate-limiter.burstCapacity: ${GATEWAY_USER_BURST:200}
                redis-rate-limiter.requestedTokens: 1
          routes:
            - id: workspace-auth-login
              uri: lb://workspace-auth
              order: 0
              predicates:
                - Path=/api/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_LOGIN_RATE:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_LOGIN_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
            - id: workspace-auth
              uri: lb://workspace-auth
              order: 10
              predicates:
                - Path=/api/auth/**
            - id: workspace-system-api-doc
              uri: lb://workspace-system
              order: 90
              predicates:
                - Path=/doc.html,/v3/api-docs/**,/webjars/**,/swagger-ui.html,/swagger-ui/**,/swagger-resources/**
            - id: workspace-system-api
              uri: lb://workspace-system
              order: 100
              predicates:
                - Path=/api/**
            - id: workspace-system-websocket
              uri: lb:ws://workspace-system
              order: 100
              predicates:
                - Path=/ws/**

logging:
  level:
    cn.sichu: info
