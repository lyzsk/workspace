project:
  name: workspace-auth
  version: @project.version@

workspace:
  jwt:
    secret: ${JWT_SECRET:dev-only-workspace-secret-0123456789abcdef}
    issuer: workspace
    access-token-ttl: ${ACCESS_TOKEN_TTL:30m}
  session:
    idle-timeout: 30m
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
  internal:
    service-token: ${WORKSPACE_SERVICE_TOKEN:dev-only-service-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: workspace-auth
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        fail-fast: ${NACOS_FAIL_FAST:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:9200}

logging:
  level:
    cn.sichu: info
