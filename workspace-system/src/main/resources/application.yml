project:
  name: workspace-system
  version: @project.version@

workspace:
  snowflake:
    worker-id: ${WORKER_ID:0}
    datacenter-id: ${DATACENTER_ID:0}
  jwt:
    secret: ${JWT_SECRET:dev-only-workspace-secret-0123456789abcdef}
    issuer: workspace
    access-token-ttl: ${ACCESS_TOKEN_TTL:30m}
  auth:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN:dev-only-gateway-token-change-me}
  internal:
    service-token: ${WORKSPACE_SERVICE_TOKEN:dev-only-service-token-change-me}
  session:
    idle-timeout: 30m
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
  generator:
    enabled: false
  login:
    max-fail-count: 5
    lock-minutes: 15
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  api-doc:
    enabled: ${API_DOC_ENABLED:false}
    title: Workspace System API
    version: 1.0.0
    server-url: /

springdoc:
  default-flat-param-object: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  production: ${KNIFE4J_PRODUCTION:true}
  setting:
    language: zh_cn
    enable-footer: false

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: workspace-system
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        fail-fast: ${NACOS_FAIL_FAST:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
  quartz:
    job-store-type: memory
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workspace?currentSchema=system}
    username: ${DB_USERNAME:workspace}
    password: ${DB_PASSWORD:workspace}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: system
    user: ${DB_MIGRATION_USERNAME:workspace}
    password: ${DB_MIGRATION_PASSWORD:workspace}
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:61114}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id

logging:
  level:
    cn.sichu: info
