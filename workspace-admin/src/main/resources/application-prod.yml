spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: system
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:61114}

workspace:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN}
    refresh-cookie:
      secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  api-doc:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  production: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    cn.sichu: info
